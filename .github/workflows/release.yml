name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Build
        run: python -m PyInstaller --noconfirm --clean DetectionSystem.spec
      - name: Smoke-test executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/Detection-System.exe" -ArgumentList "--self-test" -Wait -PassThru -WindowStyle Hidden
          $report = Join-Path $env:TEMP "Detection-System-self-test.log"
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) { throw "Executable smoke test failed with exit code $($process.ExitCode)" }
      - uses: actions/upload-artifact@v7
        with:
          name: Detection-System-Windows
          path: dist/Detection-System.exe
          if-no-files-found: error
          compression-level: 0
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/Detection-System.exe --generate-notes
