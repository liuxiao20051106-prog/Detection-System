name: Bug report
description: 报告可复现的功能问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 安全漏洞请使用 Security 页面私密报告，不要填写此表单。
  - type: input
    id: version
    attributes:
      label: 版本或提交
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: Windows/Python/GPU/CUDA 版本；请删除密钥和个人路径。
    validations:
      required: true
